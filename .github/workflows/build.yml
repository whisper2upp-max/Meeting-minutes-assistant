name: build-app

# PR 验证与 main 发布构建使用同一套测试和打包流程。
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  windows:
    name: 打包 Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements.txt pyinstaller pytest
      - name: 运行测试
        run: python -m pytest
        env:
          PYTHONPATH: src
      - name: 打包 exe
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile
          --name "会议纪要助手"
          --paths src
          --add-data "src\meetingkit\webui\index.html;meetingkit\webui"
          --add-data "src\meetingkit\webui\styles.css;meetingkit\webui"
          --add-data "src\meetingkit\webui\app.js;meetingkit\webui"
          --add-data "src\meetingkit\webui\workspace.js;meetingkit\webui"
          --add-data "src\meetingkit\webui\workspace.css;meetingkit\webui"
          --hidden-import meetingkit.audio.windows_rec
          --hidden-import pyaudiowpatch
          --hidden-import truststore._windows
          --hidden-import webview.platforms.winforms
          --hidden-import webview.platforms.edgechromium
          --version-file assets\version_info.txt
          --icon assets\app.ico
          run_app.py
      - name: 生成 Windows 安装包
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); from meetingkit import __version__; print(__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" scripts/windows_installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
      - name: 验证安装、升级和卸载
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/*-Setup.exe).FullName
          $target = Join-Path $env:RUNNER_TEMP "MeetingInstallerTest"
          foreach ($attempt in 1..2) {
            $process = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$target" -Wait -PassThru
            if ($process.ExitCode -ne 0 -or !(Test-Path "$target/会议纪要助手.exe")) { throw "Install/upgrade failed" }
          }
          $process = Start-Process "$target/unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Test-Path "$target/会议纪要助手.exe")) { throw "Uninstall failed" }
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: meetingkit-windows-installer
          path: dist/*-Setup.exe
          if-no-files-found: error
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: meetingkit-windows-exe
          path: dist/会议纪要助手.exe
          if-no-files-found: error

  macos:
    name: 打包 macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements.txt pyinstaller pytest
      - name: 运行测试
        run: python -m pytest
        env:
          PYTHONPATH: src
      - name: 打包 app
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name "会议纪要助手" \
            --paths src \
            --add-data "src/meetingkit/webui/index.html:meetingkit/webui" \
            --add-data "src/meetingkit/webui/styles.css:meetingkit/webui" \
            --add-data "src/meetingkit/webui/app.js:meetingkit/webui" \
            --add-data "src/meetingkit/webui/workspace.js:meetingkit/webui" \
            --add-data "src/meetingkit/webui/workspace.css:meetingkit/webui" \
            --add-data "assets/BlackHole2ch-0.7.1.pkg:meetingkit/assets/" \
            --hidden-import meetingkit.audio.macos_rec \
            --hidden-import webview.platforms.cocoa \
            --icon assets/app.icns \
            --osx-bundle-identifier com.meetingkit.app \
            run_app.py
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 0.2.2" "dist/会议纪要助手.app/Contents/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 0.2.2" "dist/会议纪要助手.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 0.2.2" "dist/会议纪要助手.app/Contents/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 0.2.2" "dist/会议纪要助手.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 会议声音录制需要访问麦克风，用于录入您自己的发言" "dist/会议纪要助手.app/Contents/Info.plist"
          codesign --force --deep --sign - "dist/会议纪要助手.app"
          zip -q -r -y "dist/会议纪要助手-macOS.zip" "dist/会议纪要助手.app"
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: meetingkit-macos-app
          path: dist/会议纪要助手-macOS.zip
          if-no-files-found: error
